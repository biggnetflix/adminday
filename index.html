<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>BIZ-G DAY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff1f1f;
    --primary-light: #ff6b6b;
    --primary-dark: #cc0000;
    --success: #10b981;
    --success-glow: #34d399;
    --purple: #a855f7;
    --purple-light: #c084fc;
    --gold: #fbbf24;
    --gold-light: #fcd34d;
    --dark-bg: #0a0a0f;
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-border-hover: rgba(255, 255, 255, 0.15);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.6);
    --text-muted: rgba(255, 255, 255, 0.4);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

html, body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    scroll-behavior: smooth;
}

/* Mobile - Enable scrolling */
@media (max-width: 950px) {
    html, body {
        overflow: auto;
        height: auto;
        min-height: 100vh;
    }
    
    body {
        padding: 20px 10px;
        padding-bottom: 80px;
    }
}

body {
    font-family: 'Prompt', sans-serif;
    background: radial-gradient(ellipse at top, #1a0a0a 0%, #0a0a0f 40%, #050508 70%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Mobile body - disable flex centering for scrolling */
@media (max-width: 950px) {
    body {
        display: block;
        padding-top: 40px;
    }
}

/* Smooth entrance animations */
.app > * {
    animation: staggerFadeIn 0.4s ease-out backwards;
}

.app-header { animation-delay: 0.05s; }
.left-section { animation-delay: 0.1s; }
.right-section { animation-delay: 0.15s; }

@keyframes staggerFadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Animated Background Orbs - Very Light */
.bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.4;
}

.orb-1 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255, 31, 31, 0.06), transparent 70%);
    top: -150px;
    left: -150px;
}

.orb-2 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.05), transparent 70%);
    bottom: -100px;
    right: -100px;
}

.orb-3 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.03), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* Floating Particles - Disabled for performance */
.particles {
    display: none;
}

/* Main App Container */
.app {
    width: 900px;
    padding: 40px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 0 1px var(--card-border);
    color: var(--text-primary);
    position: relative;
    z-index: 10;
}

/* Header */
.app-header {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.app-header .logo {
    width: 60px;
    height: auto;
    filter: drop-shadow(0 0 15px rgba(255, 107, 107, 0.5));
    animation: logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.app-header h1 {
    font-family: 'Kanit', sans-serif;
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #ffb3b3 35%, #ff6b6b 65%, #ff1f1f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
    text-shadow: 0 0 60px rgba(255, 107, 107, 0.4);
}

.app-header p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Divider Line */
.header-divider {
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    margin: 16px auto;
    border-radius: 2px;
}

/* Main Layout */
.main-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 28px;
}

/* Left Section */
.left-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
}

/* Date Mode Toggle - Premium */
.date-toggle {
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    padding: 8px;
    border-radius: 18px;
    border: 1px solid var(--card-border);
    box-shadow: 
        inset 0 2px 15px rgba(0,0,0,0.3),
        0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    z-index: 25;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.date-toggle:hover {
    box-shadow: 
        inset 0 2px 20px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.1),
        0 4px 15px rgba(0,0,0,0.3);
}

.toggle-btn {
    flex: 1;
    padding: 14px 24px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
}

.toggle-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
}

.toggle-btn:hover::before {
    transform: translateX(100%);
}

.toggle-btn.today {
    background: var(--success);
    color: #fff;
}

.toggle-btn.today.active {
    background: var(--success-glow);
}

.toggle-btn.custom {
    background: transparent;
    color: var(--text-secondary);
}

.toggle-btn.custom.active {
    background: var(--purple);
    color: #fff;
}

/* Date Display Card */
.date-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 24px;
    background: rgba(16, 185, 129, 0.1);
    border-radius: 18px;
    border: 1px solid rgba(16, 185, 129, 0.2);
    position: relative;
    z-index: 25;
}

.date-display .icon {
    font-size: 22px;
}

.date-display .text {
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
}

.date-display .date {
    font-family: 'Kanit', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--success-glow);
}

/* Date Input Container */
.date-input-container {
    overflow: visible;
    position: relative;
    z-index: 20;
}

.date-input-container.hidden {
    max-height: 0;
    opacity: 0;
    visibility: hidden;
}

.date-input-container.visible {
    max-height: 180px;
    opacity: 1;
    visibility: visible;
}

/* Date Input Fields */
.date-input-wrapper {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 18px;
    border: 1px solid var(--card-border);
    position: relative;
    z-index: 30;
}

.date-input-wrapper:focus-within {
    border-color: var(--primary);
}

.date-input-label {
    font-family: 'Kanit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
}

.date-input-label .icon {
    font-size: 16px;
}

.date-fields {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
}

.date-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.date-field label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.date-field input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    font-family: 'Kanit', sans-serif;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
}

.date-field input:focus {
    outline: none;
    border-color: var(--primary);
    background: rgba(255,255,255,0.1);
}

.date-field input::placeholder {
    color: var(--text-muted);
}

/* Days Container - Scrollable */
.days-container {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid var(--card-border);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 340px;
    position: relative;
    overflow: hidden;
    z-index: 1;
}

.days-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(to bottom, var(--card-bg), transparent);
    pointer-events: none;
    z-index: 10;
}

.days-container::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(to top, var(--card-bg), transparent);
    pointer-events: none;
    z-index: 10;
}

.days-wrapper {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 10px;
    padding-left: 2px;
    scrollbar-gutter: stable;
    position: relative;
    z-index: 5;
}

/* Premium Scrollbar */
.days-wrapper::-webkit-scrollbar {
    width: 8px;
}

.days-wrapper::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
}

.days-wrapper::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-light) 50%, var(--primary) 100%);
    border-radius: 12px;
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 20px rgba(255, 31, 31, 0.3);
}

.days-wrapper::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary) 50%, var(--primary-light) 100%);
    box-shadow: 0 0 30px rgba(255, 31, 31, 0.5);
}

.days {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    position: relative;
    z-index: 3;
    padding: 8px 4px;
    margin: 4px 0;
}

/* Day Button */
.day-btn {
    position: relative;
    padding: 16px 10px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-primary);
    background: rgba(255,255,255,0.05);
    transition: all 0.2s ease;
}

.day-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255, 107, 107, 0.3);
}

.day-btn.active {
    background: rgba(255, 31, 31, 0.2);
    border-color: var(--primary);
    box-shadow: 0 4px 15px rgba(255, 31, 31, 0.3);
}

/* Right Section */
.right-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Result Card */
.result-card {
    flex: 1;
    padding: 28px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 320px;
    position: relative;
}

.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    font-size: 15px;
    position: relative;
    z-index: 1;
}

.empty-state .icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.4;
    display: inline-block;
}

.empty-state .text {
    font-weight: 300;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
}

.result-content {
    position: relative;
    z-index: 1;
    margin-top: 8px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.result-row:first-child {
    padding-top: 0;
}

.result-row:hover {
    background: rgba(255,255,255,0.03);
    margin: 0 -10px;
    padding: 14px 10px;
    border-radius: 10px;
    border-color: rgba(255,255,255,0.1);
}

.result-label {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.result-value {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--text-primary);
}

.result-highlight {
    margin-top: 18px;
    padding-top: 20px;
    border-top: 2px solid rgba(255, 31, 31, 0.4);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result-highlight .label {
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.highlight {
    font-family: 'Kanit', sans-serif;
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #e6e6e67e 40%, #ffffff 70%, #ffffff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
    text-shadow: 0 0 50px rgba(255, 255, 255, 0.589);
}

/* Copy Button */
.copy-btn {
    width: 100%;
    padding: 20px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    display: none;
    transition: all 0.2s ease;
}

.copy-btn:hover {
    background: var(--success-glow);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
}

.copy-btn:active {
    transform: scale(0.98);
}

/* Toast - Right Side (Copy Notification) */
.toast-right {
    position: fixed;
    right: -400px;
    bottom: 100px;
    padding: 14px 28px;
    border-radius: 50px;
    background: rgba(16, 185, 129, 0.95);
    backdrop-filter: blur(10px);
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
    z-index: 10000;
    transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.4s ease;
    opacity: 0;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.toast-right.show {
    right: 20px;
    opacity: 1;
}

.toast-right .icon {
    font-size: 18px;
    animation: checkBounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s both;
}

@keyframes checkBounce {
    0% { 
        transform: scale(0) rotate(-45deg); 
        opacity: 0;
    }
    50% {
        transform: scale(1.3) rotate(10deg);
        opacity: 1;
    }
    70% {
        transform: scale(0.9) rotate(-5deg);
    }
    100% { 
        transform: scale(1) rotate(0deg);
        opacity: 1;
    }
}

/* Mobile toast */
@media (max-width: 950px) {
    .toast-right {
        bottom: 90px;
        right: -400px;
        padding: 12px 24px;
        font-size: 13px;
        max-width: calc(100% - 40px);
        left: 20px;
        border-radius: 40px;
    }
    
    .toast-right.show {
        right: 20px;
        left: 20px;
    }
}

/* Social Contact Button - Single Question Mark Button */
.social-contact {
    position: fixed;
    bottom: 8px;
    right: 8px;
    z-index: 9999;
}

/* Mobile social contact - handled in responsive section */

.social-toggle-btn {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    font-family: 'Kanit', sans-serif;
    color: #fff;
    background: #ff1f1f;
    box-shadow: 0 4px 12px rgba(255, 31, 31, 0.4);
    transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    animation: socialPulse 3s ease-in-out infinite;
}

.social-toggle-btn:hover {
    transform: translateY(-3px) scale(1.05);
}

.social-toggle-btn.active {
    transform: rotate(180deg) scale(0.95);
}

@keyframes socialPulse {
    0%, 100% { 
        box-shadow: 0 4px 12px rgba(255, 31, 31, 0.4);
    }
    50% { 
        box-shadow: 0 6px 20px rgba(255, 31, 31, 0.6);
    }
}

/* Social Popup Menu */
.social-popup {
    position: absolute;
    bottom: 65px;
    right: 0;
    background: rgba(20, 20, 25, 0.98);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    min-width: 220px;
    max-height: 70vh;
    overflow-y: auto;
}

.social-popup.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.social-popup .popup-header {
    text-align: center;
    margin-bottom: 16px;
}

.social-popup .popup-title {
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.5px;
}

.social-popup .popup-subtitle {
    font-family: 'Prompt', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
}

/* Quick Links Popup Section */
.quick-links-popup {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
}

.quick-link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
}

.quick-link-btn:hover {
    opacity: 0.8;
}

.quick-link-btn.sheet {
    background: #1a73e8;
    color: #fff;
}

.quick-link-btn.web {
    background: #ff1f1f;
    color: #fff;
}

.quick-link-btn .link-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
}

/* Quick Links Divider */
.quick-links-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    margin: 8px 0 16px 0;
}

.social-popup .social-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.social-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
}

.social-option:hover {
    opacity: 0.8;
}

.social-option.facebook {
    background: #1877f2;
    color: #fff;
}

.social-option.discord {
    background: #5865f2;
    color: #fff;
}

.social-option .option-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.social-option .option-icon svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

.social-option .option-label {
    flex: 1;
    text-align: left;
}

.social-option .option-action {
    font-size: 11px;
    opacity: 0.8;
    font-weight: 500;
}

/* App Logo Container */
.app-logo-container {
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 9999;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.4));
    backdrop-filter: blur(10px);
    border-radius: 0 16px 0 0;
    border-top: 1px solid rgba(255,255,255,0.15);
    border-right: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,31,31,0.1);
}

/* Mobile - reposition logo and social */
@media (max-width: 950px) {
    .app-logo-container {
        bottom: auto;
        top: 10px;
        left: 10px;
        border-radius: 16px;

<script>
let finalDateText = "";
let isTodayMode = true;
let selectedDays = null;

const formatDate = (d) => {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
};

const formatMonthText = (days) => {
    if (days >= 365 && days % 365 === 0) {
        const years = days / 365;
        return `${years} ปี`;
    }
    if (days >= 30 && days % 30 === 0) {
        const months = days / 30;
        return `${months} เดือน`;
    }
    return `${days} วัน`;
};

// Get days in month
function getDaysInMonth(month, year) {
    return new Date(year, month, 0).getDate();
}

// Validate Day input (check actual days in selected month)
function validateDay(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
    if (input.value.length > 0) {
        let val = parseInt(input.value);
        const month = parseInt(document.getElementById('inputMonth').value) || 1;
        const year = parseInt(document.getElementById('inputYear').value) || new Date().getFullYear();
        const maxDays = getDaysInMonth(month, year);

        if (val > maxDays) {
            input.value = String(maxDays).padStart(2, '0');
            showDayWarning(maxDays, month);
        }
        if (val < 1 && input.value !== '') input.value = '1';
    }
    // Auto-update date when all fields are filled
    checkAndUpdateDate();
}

// Show warning when day exceeds month limit
function showDayWarning(maxDays, month) {
    const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
                        'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    showToast(`⚠️ เดือน ${monthNames[month-1]} มีสูงสุด ${maxDays} วัน`, "warning");
}

// Validate Month input (1-12)
function validateMonth(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
    if (input.value.length > 0) {
        let val = parseInt(input.value);
        if (val > 12) input.value = '12';
        if (val < 1 && input.value !== '') input.value = '1';

        // Re-validate day when month changes
        const dayInput = document.getElementById('inputDay');
        if (dayInput.value) {
            validateDay(dayInput);
        }
    }
    // Auto-update date when all fields are filled
    checkAndUpdateDate();
}

// Validate Year input (4 digits)
function validateYear(input) {
    input.value = input.value.replace(/[^0-9]/g, '');

    // Re-validate day when year changes (for leap year)
    const dayInput = document.getElementById('inputDay');
    const monthInput = document.getElementById('inputMonth');
    if (dayInput.value && monthInput.value) {
        validateDay(dayInput);
    }
    // Auto-update date when all fields are filled
    checkAndUpdateDate();
}

// Get date from input fields
function getInputDate() {
    const day = parseInt(document.getElementById('inputDay').value) || 1;
    const month = parseInt(document.getElementById('inputMonth').value) || 1;
    const year = parseInt(document.getElementById('inputYear').value) || new Date().getFullYear();
    
    return new Date(year, month - 1, day);
}

// Set input fields to a date
function setInputDate(date) {
    document.getElementById('inputDay').value = String(date.getDate()).padStart(2, '0');
    document.getElementById('inputMonth').value = String(date.getMonth() + 1).padStart(2, '0');
    document.getElementById('inputYear').value = String(date.getFullYear());
}

// Check if all date fields are filled and update display
function checkAndUpdateDate() {
    const dayVal = document.getElementById('inputDay').value;
    const monthVal = document.getElementById('inputMonth').value;
    const yearVal = document.getElementById('inputYear').value;

    // Only update if all fields have values
    if (dayVal && monthVal && yearVal) {
        const day = parseInt(dayVal) || 1;
        const month = parseInt(monthVal) || 1;
        const year = parseInt(yearVal) || new Date().getFullYear();
        const customDate = new Date(year, month - 1, day);
        document.getElementById('todayDate').textContent = formatDate(customDate);
        
        // Auto-calculate if a day has been selected
        if (selectedDays && !isTodayMode) {
            calculateFromCustomDate();
        }
    }
}

    window.open('https://docs.google.com/spreadsheets/d/1_ulE4CrKnsCjlzyz0N-n94yEep1OsQub7LBgUbSLDUs/edit?pli=1&gid=289997355#gid=289997355', '_blank');

function setTodayMode() {
    isTodayMode = true;
    document.getElementById('todayBtn').classList.add('active');
    document.getElementById('todayBtn').classList.remove('custom');
    document.getElementById('customBtn').classList.remove('active');
    document.getElementById('customBtn').classList.add('today');

    document.getElementById('dateInputContainer').classList.add('hidden');
    
    const today = new Date();
    document.getElementById('todayDate').textContent = formatDate(today);
    setInputDate(today);
    
    if (selectedDays) {
        calculate(selectedDays);

function setCustomMode() {
    isTodayMode = false;
    document.getElementById('customBtn').classList.add('active');

    document.getElementById('todayBtn').classList.remove('active');
    document.getElementById('todayBtn').classList.add('custom');

    document.getElementById('todayDisplay').style.display = 'none';
    document.getElementById('dateInputContainer').classList.remove('hidden');
    document.getElementById('dateInputContainer').classList.add('visible');

    setTimeout(() => {
        document.getElementById('inputDay').focus();
    }, 300);

    if (selectedDays) {
        calculateFromCustomDate();
    }
}

function getStartDate() {
    if (isTodayMode) {
        return new Date();
    } else {
        return getInputDate();
    }
}

function selectDay(el, days) {
    // Remove active from all buttons
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));

    // Add active to clicked button
    el.classList.add('active');

    // Set selected days and calculate
    selectedDays = days;
    calculate(days);
}

function calculate(days) {
    const startDate = getStartDate();
    let endDate = new Date(startDate);

    // Special case: 1 day = start date + 1 day
    if (days === 1) {
        endDate.setDate(startDate.getDate() + 1);
    }
    // For all other cases: add the exact number of days (start date = day 1)
    // Example: Start 30/03, select 30 days → 30/03 (day 1) + 29 = 28/04 (day 30)
    else {
        endDate.setDate(startDate.getDate() + days - 1);
    }

    finalDateText = formatDate(endDate);

    // Calculate actual days count (inclusive from start to end)
    const actualDays = days === 1 ? 1 : days;

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('resultContent').style.display = 'block';
    document.getElementById('resultCard').classList.add('show');

    document.getElementById('resultStart').textContent = formatDate(startDate);
    document.getElementById('resultDays').textContent = formatMonthText(days);
    document.getElementById('resultCount').textContent = `${actualDays} วัน`;
    document.getElementById('resultExpire').textContent = finalDateText;

    document.getElementById("copyBtn").style.display = "block";
}

function calculateFromCustomDate() {
    if (selectedDays) {
        calculate(selectedDays);
    }
}

function copyDate() {
    if (!finalDateText) {
        showToast("⚠️ ยังไม่มีข้อมูลวันหมดอายุ", "warning");
        return;
    }

    navigator.clipboard.writeText(finalDateText).then(() => {
        showToast("คัดลอกวันหมดอายุเรียบร้อยแล้ว", "success");
    }).catch(err => {
        // Fallback: ลองใช้วิธีเก่าถ้า clipboard API ไม่ทำงาน
        const textArea = document.createElement("textarea");
        textArea.value = finalDateText;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
            document.execCommand("copy");
            showToast("คัดลอกวันหมดอายุเรียบร้อยแล้ว", "success");
        } catch (e) {
            showToast("❌ คัดลอกไม่สำเร็จ กรุณาลองใหม่", "error");
        }
        
        document.body.removeChild(textArea);
    });
}

// Show Toast Notification
function showToast(message, type = "success") {
    const toastRight = document.getElementById("toastRight");

    // ตั้งค่าสีตามประเภท
    const colors = {
        success: 'rgb(16, 185, 129)',
        error: 'rgb(239, 68, 68)',
        warning: 'rgb(245, 158, 11)',
        info: 'rgb(59, 130, 246)'
    };

    const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
    };

    // Hide toast first
    toastRight.classList.remove('show');

    // Update content and show
    setTimeout(() => {
        toastRight.style.background = colors[type] || colors.success;
        const icon = icons[type] || icons.success;
        toastRight.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
        toastRight.classList.add('show');

        // Auto-hide after 2.5 seconds
        setTimeout(() => {
            toastRight.classList.remove('show');
        }, 2500);
    }, 30);
}

// Toggle Social Popup
function toggleSocialPopup() {
    const popup = document.getElementById('socialPopup');
    const btn = document.getElementById('socialToggleBtn');
    popup.classList.toggle('show');
    btn.classList.toggle('active');
}

// Close popup when clicking outside
document.addEventListener('click', function(event) {
    const popup = document.getElementById('socialPopup');
    const btn = document.getElementById('socialToggleBtn');
    if (popup && !popup.contains(event.target) && !btn.contains(event.target)) {
        popup.classList.remove('show');
        btn.classList.remove('active');
    }
});

    const btn = document.querySelector('.social-option.facebook');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => {
        btn.style.transform = '';
    }, 150);

    // Open Facebook profile in new tab
    window.open('https://www.facebook.com/bank.kub.448958', '_blank');

    // Close popup
    setTimeout(() => {
        const popup = document.getElementById('socialPopup');
        const toggleBtn = document.getElementById('socialToggleBtn');
        popup.classList.remove('show');
        toggleBtn.classList.remove('active');
    }, 200);
}
