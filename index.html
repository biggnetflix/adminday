<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang Members - แก็งมาเฟีย</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #fbbf24;
            --gold-light: #fcd34d;
            --gold-dark: #d97706;
            --bronze: #b45309;
            --dark-bg: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(251, 191, 36, 0.15);
            --card-border-hover: rgba(251, 191, 36, 0.35);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(ellipse at top, #1a1205 0%, #0a0a0f 40%, #050508 70%, #000000 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Lightweight Background Orbs - CSS only, no blur */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            animation: orbFloat 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.06), transparent 70%);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(180, 83, 9, 0.05), transparent 70%);
            bottom: -100px;
            right: -100px;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.04), transparent 70%);
            top: 40%;
            left: 60%;
            animation-delay: -16s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.05); }
        }

        /* Simple Particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.4;
            animation: particleFloat 15s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; top: 60%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 35%; top: 90%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 50%; top: 70%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 65%; top: 85%; animation-delay: 3s; }
        .particle:nth-child(6) { left: 80%; top: 65%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 90%; top: 75%; animation-delay: 2.5s; }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-30px); opacity: 0.6; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 0;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-crown {
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--bronze) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-family: 'Kanit', sans-serif;
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 35%, var(--gold) 65%, var(--bronze) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 20px auto;
            border-radius: 2px;
        }

        /* Stats Grid */
        .gang-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 45px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--card-border-hover);
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
        }

        .stat-number {
            font-family: 'Kanit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--bronze) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s ease;
        }

        .stat-card:hover .stat-number {
            transform: scale(1.05);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Members Section */
        .members-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Kanit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 26px;
            background: linear-gradient(180deg, var(--gold-light), var(--bronze));
            border-radius: 2px;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .member-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.3s ease;
            position: relative;
        }

        .member-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--bronze), var(--gold), var(--gold-light));
            border-radius: 20px 20px 0 0;
        }

        .member-card:hover {
            transform: translateY(-6px);
            border-color: var(--card-border-hover);
            background: linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 20px 50px rgba(251, 191, 36, 0.15);
        }

        .member-card:hover .member-avatar {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(251, 191, 36, 0.4);
        }

        .member-content {
            position: relative;
            z-index: 1;
        }

        .member-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--bronze) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            font-weight: 800;
            color: #0a0a0f;
            border: 3px solid rgba(251, 191, 36, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.25);
            font-family: 'Kanit', sans-serif;
        }

        .member-name {
            font-family: 'Kanit', sans-serif;
            font-size: 1.4rem;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .member-role {
            color: var(--gold);
            text-align: center;
            font-size: 0.92rem;
            margin-bottom: 18px;
            font-style: italic;
            font-weight: 400;
        }

        .member-info {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .info-row:hover {
            background: rgba(255,255,255,0.03);
            margin: 0 -8px;
            padding: 6px 8px;
            border-radius: 6px;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
            text-align: right;
        }

        .rank-badge {
            display: inline-block;
            padding: 7px 18px;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .rank-badge:hover {
            transform: scale(1.05);
        }

        .rank-boss {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--bronze) 100%);
            color: #0a0a0f;
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
        }

        .rank-underboss {
            background: linear-gradient(135deg, var(--gold) 0%, var(--bronze) 100%);
            color: #0a0a0f;
            box-shadow: 0 6px 20px rgba(180, 83, 9, 0.4);
        }

        .rank-capo {
            background: linear-gradient(135deg, var(--bronze) 0%, var(--gold-dark) 100%);
            color: var(--text-primary);
            box-shadow: 0 5px 18px rgba(180, 83, 9, 0.35);
        }

        .rank-soldier {
            background: linear-gradient(135deg, rgba(180, 83, 9, 0.5) 0%, rgba(139, 69, 19, 0.7) 100%);
            color: var(--text-primary);
            box-shadow: 0 5px 18px rgba(139, 69, 19, 0.35);
        }

        .rank-associate {
            background: linear-gradient(135deg, rgba(100, 80, 30, 0.5) 0%, rgba(139, 69, 19, 0.6) 100%);
            color: var(--text-primary);
            box-shadow: 0 5px 18px rgba(100, 80, 30, 0.35);
        }

        .rank-container {
            text-align: center;
            margin-top: 14px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 35px 0 20px;
            margin-top: 50px;
            border-top: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        .footer-ornament {
            font-size: 24px;
            color: var(--gold);
            margin-bottom: 12px;
            display: inline-block;
        }

        footer p {
            font-size: 13px;
            letter-spacing: 1px;
        }

        .footer-tagline {
            margin-top: 10px;
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .gang-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-number {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-crown">♛</div>
            </div>
            <h1>GANG MEMBERS</h1>
            <p class="subtitle">รายชื่อสมาชิกแก็งมาเฟีย</p>
            <div class="divider"></div>
        </header>

        <div class="gang-stats">
            <div class="stat-card">
                <div class="stat-number" id="total-members">0</div>
                <div class="stat-label">สมาชิกทั้งหมด</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-capos">0</div>
                <div class="stat-label">หัวหน้าแก๊ง</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-soldiers">0</div>
                <div class="stat-label">ลูกน้อง</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-territories">0</div>
                <div class="stat-label">เขตอำนาจ</div>
            </div>
        </div>

        <div class="members-section">
            <h2 class="section-title">สมาชิกทั้งหมด</h2>
            <div class="members-grid" id="members-grid">
                <!-- Member cards will be inserted here -->
            </div>
        </div>

        <footer>
            <div class="footer-ornament">♛</div>
            <p>&copy; 2026 Gang Member List. All Rights Reserved.</p>
            <p class="footer-tagline">อำนาจ • เกียรติ • ศักดิ์ศรี</p>
        </footer>
    </div>

    <script>
        const gangMembers = [
            {
                id: 1,
                name: "วิชัย สิงห์ทอง",
                nickname: "เสี่ยวิชัย",
                role: "หัวหน้าใหญ่",
                rank: "boss",
                age: 52,
                territory: "กรุงเทพฯ",
                specialty: "บริหารธุรกิจ"
            },
            {
                id: 2,
                name: "สมชาย ดุร้าย",
                nickname: "เสือสมชาย",
                role: "รองหัวหน้า",
                rank: "underboss",
                age: 45,
                territory: "ธนบุรี",
                specialty: "ยุทธการ"
            },
            {
                id: 3,
                name: "ประยุทธ เหยี่ยวดำ",
                nickname: "เหยี่ยวประยุทธ",
                role: "หัวหน้าแก๊ง",
                rank: "capo",
                age: 38,
                territory: "บางกอกน้อย",
                specialty: "สืบสวน"
            },
            {
                id: 4,
                name: "สมศักดิ์ ดุจฟ้า",
                nickname: "ฟ้าสมศักดิ์",
                role: "สมาชิก",
                rank: "soldier",
                age: 32,
                territory: "บางพลัด",
                specialty: "การเงิน"
            },
            {
                id: 5,
                name: "มานะ กล้าหาญ",
                nickname: "ทิดมานะ",
                role: "สมาชิก",
                rank: "soldier",
                age: 29,
                territory: "ตลิ่งชัน",
                specialty: "โลจิสติกส์"
            },
            {
                id: 6,
                name: "วิไล เพชรทอง",
                nickname: "เพชรวิไล",
                role: "สมาชิก",
                rank: "soldier",
                age: 35,
                territory: "บางแค",
                specialty: "เจรจา"
            },
            {
                id: 7,
                name: "สมหวัง มั่นคง",
                nickname: "หวังสมหวัง",
                role: "ผู้ร่วมงาน",
                rank: "associate",
                age: 27,
                territory: "ภาษีเจริญ",
                specialty: "ไอที"
            },
            {
                id: 8,
                name: "สุชาติ นักรบ",
                nickname: "ชาติสุชาติ",
                role: "สมาชิก",
                rank: "soldier",
                age: 31,
                territory: "บางบอน",
                specialty: "รักษาความปลอดภัย"
            }
        ];

        const rankLabels = {
            boss: "BOSS",
            underboss: "UNDERBOSS",
            capo: "CAPO",
            soldier: "SOLDIER",
            associate: "ASSOCIATE"
        };

        function getInitials(name) {
            return name.charAt(0);
        }

        function renderMembers() {
            const grid = document.getElementById('members-grid');
            grid.innerHTML = '';

            gangMembers.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.style.animation = `fadeInUp 0.5s ease ${index * 0.08}s backwards`;
                card.innerHTML = `
                    <div class="member-content">
                        <div class="member-avatar">${getInitials(member.name)}</div>
                        <h3 class="member-name">${member.nickname}</h3>
                        <p class="member-role">${member.role}</p>
                        <div class="member-info">
                            <div class="info-row">
                                <span class="info-label">ชื่อจริง</span>
                                <span class="info-value">${member.name}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">อายุ</span>
                                <span class="info-value">${member.age} ปี</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">เขต</span>
                                <span class="info-value">${member.territory}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">ความเชี่ยวชาญ</span>
                                <span class="info-value">${member.specialty}</span>
                            </div>
                            <div class="rank-container">
                                <span class="rank-badge rank-${member.rank}">${rankLabels[member.rank]}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('total-members').textContent = gangMembers.length;
            document.getElementById('total-capos').textContent = gangMembers.filter(m => m.rank === 'capo' || m.rank === 'boss' || m.rank === 'underboss').length;
            document.getElementById('total-soldiers').textContent = gangMembers.filter(m => m.rank === 'soldier').length;
            document.getElementById('total-territories').textContent = new Set(gangMembers.map(m => m.territory)).size;
        }

        // Add fadeInUp animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener('DOMContentLoaded', () => {
            renderMembers();
            updateStats();
        });
    </script>
</body>
</html>
